[project]
name = "detour"
version = "0.1.0"
description = "Serendipity-aware recommendation engine for GitHub repositories"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "httpx>=0.27",
    "numpy>=1.26",
    # Pretrained static embedding model; its weights + tokenizer ship inside the wheel,
    # so no model download is needed at runtime (see docs/decisions.md D-010).
    "wordllama==0.4.0.post1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "httpx2>=2.0",  # required by starlette.testclient (plain httpx is deprecated there)
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/detour"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Migrations contain verbatim SQL constraint expressions; wrapping them hurts readability.
"src/detour/db/migrations/versions/*" = ["E501"]
# Curated data table: one interest per entry reads better unwrapped.
"src/detour/representation/interests.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[[tool.mypy.overrides]]
module = ["wordllama.*", "safetensors.*", "tokenizers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "db: test requires a running PostgreSQL (TEST_DATABASE_URL)",
]
