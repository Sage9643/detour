name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: detour
          POSTGRES_PASSWORD: detour
          POSTGRES_DB: detour_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U detour -d detour_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      # CI-only throwaway credentials for the service container above.
      DATABASE_URL: postgresql+psycopg://detour:detour@localhost:5432/detour_test
      TEST_DATABASE_URL: postgresql+psycopg://detour:detour@localhost:5432/detour_test
      DETOUR_REQUIRE_DB_TESTS: "1"
      DETOUR_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy

      - name: Migrations apply, match models, and round-trip
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head

      - name: Tests
        run: pytest -W error::DeprecationWarning
